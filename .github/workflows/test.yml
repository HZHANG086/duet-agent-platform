name: Platform tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt httpx2
      - run: python -m unittest discover -s tests
      - run: |
          for script in docs/*.js; do
            node --check "$script" || exit 1
          done
